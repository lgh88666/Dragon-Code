[project]
name = "dragon-code"
version = "0.1.0"
description = "Claude Code 风格的终端 AI 编程助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75",
    "openai>=2.11",
    "pyyaml>=6.0",
    "rich>=14.0",
    "textual>=6.6,<7",
]

[project.scripts]
dragon-code = "dragon_code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dragon_code"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
